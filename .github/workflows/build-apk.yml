name: Build Luma TV APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Restore signing key used by this repository's builds
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: ${{ runner.os }}-luma-tv-v5-debug-key-v1
      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Check APK size
        run: |
          stat -c 'APK size: %s bytes' app/build/outputs/apk/debug/app-debug.apk
          if [ "$(stat -c%s app/build/outputs/apk/debug/app-debug.apk)" -gt 10485760 ]; then
            echo 'WARNING: debug APK is larger than the desired 10 MiB target.'
          fi
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LumaTV-8.1-luDOS2-StabilityPlus-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
